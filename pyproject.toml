[project]
name = "graphstrider"
version = "0.1.0"
description = "Deterministic Text-to-SPARQL retrieval pipeline over a local pyoxigraph KB"
requires-python = ">=3.10"
dependencies = [
    "pyoxigraph>=0.3.22",
    "openai>=1.40.0",
    "python-dotenv>=1.0.1",
    "tqdm>=4.66.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

